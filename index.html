<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Eunsub Shim의 작은 웹 도구 모음 — 소개, 공학용 계산기, 타이머" />
  <meta name="color-scheme" content="light dark" />
  <title>Claude_PJT</title>

  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="stylesheet" href="./css/styles.css" />
  <script>
    // 다크 모드 깜빡임 방지: 스타일시트 적용 전에 저장된 테마를 먼저 반영.
    try {
      var t = JSON.parse(localStorage.getItem("cpjt:theme"));
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="./">
        <img class="brand__logo" src="./assets/favicon.svg" alt="" width="28" height="28" />
        <span class="brand__name">Claude_PJT</span>
      </a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">테마</button>
    </div>
  </header>

  <main class="container">
    <section class="intro">
      <h1>무엇을 열어볼까요?</h1>
      <p>카드를 누르면 해당 페이지가 열립니다. 지금은 소개, 공학용 계산기, 타이머가 준비돼 있어요.</p>
    </section>

    <nav class="card-grid" aria-label="바로가기">
      <a class="card" href="./about.html">
        <span class="card__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="3.5" />
            <path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5" />
          </svg>
        </span>
        <h2 class="card__title">소개</h2>
        <p class="card__desc">제가 누구인지, 이 사이트가 뭘 하는 곳인지 짧게 정리했습니다.</p>
      </a>

      <a class="card" href="./calculator.html">
        <span class="card__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="3" width="14" height="18" rx="2.5" />
            <path d="M8.5 7h7" />
            <path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01M8.5 15h.01M12 15h.01M15.5 15h.01M8.5 18h.01M12 18h.01M15.5 18h.01" />
          </svg>
        </span>
        <h2 class="card__title">공학용 계산기</h2>
        <p class="card__desc">삼각함수·로그·거듭제곱·팩토리얼까지 되는 계산기.</p>
      </a>

      <a class="card" href="./timer.html">
        <span class="card__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="13" r="8" />
            <path d="M12 9v4l2.5 2M9 2h6" />
          </svg>
        </span>
        <h2 class="card__title">타이머</h2>
        <p class="card__desc">분·초를 정해 두고 카운트다운. 끝나면 소리로 알려줍니다.</p>
      </a>
    </nav>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year">2026</span> Claude_PJT · MIT License</p>
    </div>
  </footer>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
