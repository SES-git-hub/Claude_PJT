<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="공학용 계산기 — 삼각함수, 로그, 거듭제곱, 팩토리얼" />
  <meta name="color-scheme" content="light dark" />
  <title>공학용 계산기 · Claude_PJT</title>

  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="stylesheet" href="./css/styles.css" />
  <script>
    try {
      var t = JSON.parse(localStorage.getItem("cpjt:theme"));
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  </script>
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="./">
        <img class="brand__logo" src="./assets/favicon.svg" alt="" width="28" height="28" />
        <span class="brand__name">Claude_PJT</span>
      </a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">테마</button>
    </div>
  </header>

  <main class="container page">
    <a class="back-link" href="./">← 홈으로</a>
    <h1>공학용 계산기</h1>

    <div class="calc" id="calc">
      <div class="calc__screen">
        <div class="calc__expr" id="calc-expr" aria-live="off">&nbsp;</div>
        <output class="calc__result" id="calc-result">0</output>
      </div>

      <div class="calc__modes">
        <button class="btn" id="calc-angle" type="button">DEG</button>
        <span class="calc__error" id="calc-error" role="status" aria-live="polite"></span>
      </div>

      <div class="calc__keys" id="calc-keys"><!-- 버튼은 calculator.js가 생성 --></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year">2026</span> Claude_PJT · MIT License</p>
    </div>
  </footer>

  <script type="module" src="./js/calculator.js"></script>
</body>
</html>
